spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}
  seed:
    enabled: ${SEED_ENABLED:false}
    demo-enabled: false

logging:
  level:
    root: INFO
    com.devsecops.taskflow: INFO